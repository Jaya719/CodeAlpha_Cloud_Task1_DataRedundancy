
<!DOCTYPE html>
<html>
<head>
    <title>Data Redundancy Removal System</title>
    <style>
        body {
            font-family: Arial;
            background: #eef2f7;
            margin: 40px;
        }
        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }
        h1 { text-align: center; color: #263b63; }
        input {
            width: 95%;
            padding: 12px;
            margin: 8px 0;
        }
        button {
            padding: 12px 20px;
            background: #263b63;
            color: white;
            border: none;
            cursor: pointer;
        }
        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th { background: #263b63; color: white; }
        .message { color: green; }
    </style>
</head>
<body>
<div class="container">
    <h1>Data Redundancy Removal System</h1>

    {% for message in get_flashed_messages() %}
        <p class="message">{{ message }}</p>
    {% endfor %}

    <h3>Add Student Details</h3>

    <form action="/add" method="POST">
        <input type="text" name="name" placeholder="Student Name" required>
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="text" name="department" placeholder="Department" required>
        <button type="submit">Add Student</button>
    </form>

    <h3>Student Records</h3>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.department }}</td>
        </tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
